name: LMK v12 visual QA
# Second pass: verify ceremonial line breaks and compact share disclosure
on:
  push:
    paths:
      - '.github/workflows/lmk-preview-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run screenshot tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          sleep 2
          node qa/lmk-v12-visual.mjs
      - name: Save screenshots for review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/visual-v12/
          git diff --cached --quiet || (git commit -m "Store temporary v12 mobile visual checks" && git push)
