name: LMK v15 final editorial QA
# Verify shortened first letter line remains intact at 320px and all layouts
on:
  push:
    paths:
      - '.github/workflows/lmk-preview-v15-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run v15 visual QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          sleep 2
          node qa/lmk-v15-visual.mjs
      - name: Save visual review captures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/visual-v15/
          git diff --cached --quiet || (git commit -m "Capture noble v15 typography snapshots" && git push)
