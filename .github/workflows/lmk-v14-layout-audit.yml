name: LMK v14 layout stress audit
# Stress all 100 canonical birthplace variants and compare shorter type labels
on:
  push:
    paths:
      - '.github/workflows/lmk-v14-layout-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  typography:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit birthplace and headings
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          sleep 2
          node qa/lmk-v14-layout-audit.mjs
      - name: Commit audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/audit-v14/
          git diff --cached --quiet || (git commit -m "Save v14 typography stress audit" && git push)
