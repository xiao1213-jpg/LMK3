<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>プライバシーについて</title><link rel="stylesheet" href="assets/design.css"><main><article class="sheet"><h1>プライバシーについて</h1><p>この六問版では、診断の回答と猫の記録をブラウザ内で処理します。独自のアクセス解析は組み込んでいません。</p><p>結果を再表示するため、ブラウザの保存領域を使います。共有リンクとQRには、結果を復元するための六問の選択内容と抽選用の番号が含まれます。名前や連絡先の入力はありません。</p><p>画像を送信するときは、端末の共有機能で送信先を選べます。共有リンクを受け取った方は、その猫の結果を読むことができます。</p><p>ホスティングサービスが運用上取得する情報は、そのサービスの規定によります。</p><a href="index.html#start_page">診断へ戻る</a></article></main></html>
